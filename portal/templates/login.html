{% extends "base.html" %}
{% block title %}Sign in | Farm Energy Portal{% endblock %}
{% block body %}
<main class="shell login">
    <section class="panel login-panel">
        <h1>Sign in</h1>
        <p class="muted">Farm Energy Portal</p>
        {% if demo %}<p class="notice">Preview mode</p>{% endif %}
        {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="primary" type="submit">Sign in</button>
        </form>
    </section>
</main>
{% endblock %}
