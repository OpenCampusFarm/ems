[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[program:core]
command=/home/pi/ems/core/.venv/bin/python -u main.py
directory=/home/pi/ems/core
user=pi
autostart=true
startsecs=0
autorestart=unexpected
exitcodes=0
stopwaitsecs=110
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/tmp/ems_core.log
stderr_logfile=/tmp/ems_core.log

[program:fan]
command=uv run python -u main.py
directory=/home/pi/ems/fan
user=root
autostart=true
autorestart=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/tmp/ems_fan.log
stderr_logfile=/tmp/ems_fan.log

[program:updater]
command=/bin/bash /home/pi/ems/update.sh
directory=/home/pi/ems
user=pi
autostart=true
autorestart=true
environment=UPDATE_INTERVAL="120"
stdout_logfile=/tmp/ems_updater.log
stderr_logfile=/tmp/ems_updater.log

[program:dashboard_publisher]
; Records local carbon by default and publishes to Drupal when configured.
command=uv run python -u dashboard_publisher.py
directory=/home/pi/ems/core
user=pi
autostart=true
autorestart=unexpected
exitcodes=0
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/tmp/ems_dashboard_publisher.log
stderr_logfile=/tmp/ems_dashboard_publisher.log

[program:cloudflared]
command=/bin/sh /home/pi/ems/portal/run_cloudflared.sh
directory=/home/pi/ems
user=pi
autostart=true
startsecs=0
autorestart=unexpected
exitcodes=0
stdout_logfile=/tmp/ems_cloudflared.log
redirect_stderr=true

[include]
files=/run/campus-ems/portal.conf
